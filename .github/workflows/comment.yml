name: guestbook-bot

on:
  schedule:
    # 每 30 分钟跑一次（cron 用 UTC 时间；GitHub 最短支持 5 分钟间隔）
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只预览不发（勾选后不会真的发留言）"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: guestbook-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 发送一条留言
        env:
          GUESTBOOK_API: https://www.xuxuxiang.fun/api/guestbook
          COMMENT_SITE: https://www.xuxuxiang.fun
          ORDER: sequential
          # 设 0：GitHub 的定时任务本身就会有几分钟的随机延迟，不需要额外 sleep。
          # 每多 sleep 1 秒，都会算进 Actions 的免费额度消耗。
          JITTER_SECONDS: "0"
          DRY_RUN: ${{ inputs.dry_run }}
        run: python post_comment.py

      - name: 回写进度与发送记录（同时让仓库保持活跃，避免定时任务被停用）
        if: always()
        run: |
          if [ ! -f state.json ]; then
            echo "本次没有推进进度，无需回写"
            exit 0
          fi
          git config user.name "guestbook-bot"
          git config user.email "guestbook-bot@users.noreply.github.com"
          git add state.json
          if [ -f sent.log ]; then
            git add sent.log
          fi
          if git diff --cached --quiet; then
            echo "进度没有变化，不产生提交"
            exit 0
          fi
          git commit -m "progress: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if git push; then
            echo "进度已回写"
          else
            echo "推送失败，先同步远端再推一次"
            git pull --rebase origin "${GITHUB_REF_NAME}" || echo "同步远端失败"
            git push || echo "进度这次没能回写。脚本下次会先查重，不会重复留言。"
          fi

      - name: 全部发完后自动停用本工作流（避免空转）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f state.json ]; then
            exit 0
          fi
          FINISHED=$(python -c "import json;print('true' if json.load(open('state.json')).get('finished') else 'false')" 2>/dev/null || echo false)
          if [ "$FINISHED" != "true" ]; then
            exit 0
          fi
          echo "表格里的留言已全部发送完毕，停用本工作流。"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/comment.yml/disable" \
            && echo "已停用。以后想再跑，到 Actions 页面点 Enable workflow 即可。" \
            || echo "自动停用没成功（不影响结果：脚本本身已经不会再发任何内容）"
